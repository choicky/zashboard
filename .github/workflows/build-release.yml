name: '3a · Build and publish (called by 3, do not run directly)'

on:
  # Single implementation of package construction and publication, reachable
  # only from auto-release after validation, eligibility and tag provenance.
  # There is deliberately no tag-push or manual entry: those would publish
  # without validation. To retry a release, re-run auto-release with the PR.
  workflow_call:
    inputs:
      tag:
        description: 'Stable sb-v tag to build and publish'
        required: true
        type: string
      source_sha:
        description: 'Reviewed commit the tag points at'
        required: true
        type: string
    outputs:
      tag:
        value: ${{ jobs.release.outputs.tag }}
      url:
        value: ${{ jobs.release.outputs.url }}

permissions:
  contents: write

concurrency:
  group: fork-release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  GH_REPO: ${{ github.repository }}
  RELEASE_TAG: ${{ inputs.tag }}
  RELEASE_SHA: ${{ inputs.source_sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - font: all
            name: zashboard-singbox-full
          - font: none
            name: zashboard-singbox-no-fonts
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
      - name: Install and build
        env:
          FONT: ${{ matrix.font }}
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm run build
          test -f dist/index.html
          test "$(find dist -type f | wc -l)" -gt 1
          mkdir -p package
          cp -a dist package/dist
          (cd package && zip -qr "../${{ matrix.name }}.zip" dist)
      - name: Check package and checksum
        run: |
          set -euo pipefail
          unzip -l "${{ matrix.name }}.zip" | grep -E 'dist/index.html|dist/assets/'
          sha256sum "${{ matrix.name }}.zip" >> SHA256SUMS
          {
            printf 'release_tag=%s\n' "$RELEASE_TAG"
            printf 'source_sha=%s\n' "$RELEASE_SHA"
            printf 'release_identity=%s\n' "$RELEASE_TAG"
            printf 'artifact=%s\n' "${{ matrix.name }}.zip"
          } > MANIFEST
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}.zip
            MANIFEST
            SHA256SUMS

  release:
    needs: build
    outputs:
      tag: ${{ env.RELEASE_TAG }}
      url: ${{ steps.publish.outputs.url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Enforce release provenance
        # The tag must already exist
        # and resolve exactly to the reviewed source commit; a missing tag,
        # invalid tag, or any SHA mismatch fails. Publication must not create
        # the tag implicitly.
        run: |
          set -euo pipefail
          git fetch origin --tags --prune
          resolved=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{}" 2>/dev/null) || {
            echo "release tag $RELEASE_TAG is missing or invalid" >&2
            exit 1
          }
          test "$resolved" = "$RELEASE_SHA" || {
            echo "tag $RELEASE_TAG resolves to $resolved, expected $RELEASE_SHA" >&2
            exit 1
          }
      - uses: actions/download-artifact@v8
        with:
          path: release
      - name: Assemble manifest and checksums
        run: |
          set -euo pipefail
          find release -name '*.zip' -exec cp {} . \;
          {
            printf 'release_tag=%s\n' "$RELEASE_TAG"
            printf 'source_sha=%s\n' "$RELEASE_SHA"
            printf 'release_identity=%s\n' "$RELEASE_TAG"
            printf 'artifact=zashboard-singbox-full.zip\n'
            printf 'artifact=zashboard-singbox-no-fonts.zip\n'
          } > MANIFEST
          sha256sum zashboard-singbox-full.zip zashboard-singbox-no-fonts.zip > SHA256SUMS
          node scripts/verify-release-assets.mjs --dir . --tag "$RELEASE_TAG" --sha "$RELEASE_SHA"
      - name: Publish (idempotent on the same tag)
        id: publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ env.RELEASE_SHA }}
          overwrite_files: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-rc') || contains(env.RELEASE_TAG, '-test') }}
          make_latest: ${{ !contains(env.RELEASE_TAG, '-rc') && !contains(env.RELEASE_TAG, '-test') }}
          generate_release_notes: true
          files: |
            zashboard-singbox-full.zip
            zashboard-singbox-no-fonts.zip
            MANIFEST
            SHA256SUMS
      - name: Verify published release state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          api="repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG"
          # GitHub propagation is not immediate; retry only this bounded check.
          state=''
          for _ in $(seq 1 5); do
            state=$(gh api "$api" --jq '{tag:.tag_name,assets:[.assets[].name]}' 2>/dev/null || true)
            if [ -n "$state" ] && [ "$(printf '%s' "$state" | jq -r .tag)" = "$RELEASE_TAG" ]; then
              break
            fi
            sleep 5
          done
          test "$(printf '%s' "$state" | jq -r .tag)" = "$RELEASE_TAG" || {
            echo "release $RELEASE_TAG is not visible" >&2; exit 1; }
          actual=$(printf '%s' "$state" | jq -r '.assets[]' | sort | paste -sd' ' -)
          test "$actual" = 'MANIFEST SHA256SUMS zashboard-singbox-full.zip zashboard-singbox-no-fonts.zip' || {
            echo "unexpected release asset set: $actual" >&2; exit 1; }
      - name: Verify published asset URLs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          fetch_ok() {
            local url="$1" out="${2:-/dev/null}" code
            for _ in $(seq 1 5); do
              code=$(curl -sSL -o "$out" -w '%{http_code}' "$url" || true)
              [ "$code" = 200 ] && return 0
              sleep 5
            done
            return 1
          }
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG"
          for name in zashboard-singbox-full.zip zashboard-singbox-no-fonts.zip MANIFEST SHA256SUMS; do
            fetch_ok "$base/$name" "$RUNNER_TEMP/$name" || {
              echo "asset $name is not downloadable" >&2; exit 1; }
          done
          (cd "$RUNNER_TEMP" && sha256sum -c "$GITHUB_WORKSPACE/SHA256SUMS")
          if [[ ! "$RELEASE_TAG" =~ -rc|-test ]]; then
            latest="https://github.com/$GITHUB_REPOSITORY/releases/latest/download"
            for name in zashboard-singbox-full.zip zashboard-singbox-no-fonts.zip; do
              fetch_ok "$latest/$name" || { echo "latest/download/$name did not resolve" >&2; exit 1; }
            done
          fi
      - name: Job summary
        if: always()
        run: |
          {
            printf '## Fork release\n\n'
            printf '| Item | Value |\n| --- | --- |\n'
            printf '| Tag | `%s` |\n' "$RELEASE_TAG"
            printf '| Source SHA | `%s` |\n' "$RELEASE_SHA"
            for name in zashboard-singbox-full.zip zashboard-singbox-no-fonts.zip MANIFEST SHA256SUMS; do
              if [ -f "$name" ]; then
                printf '| %s | %s bytes | `%s` |\n' "$name" "$(stat -c%s "$name")" "$(sha256sum "$name" | cut -d' ' -f1)"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
