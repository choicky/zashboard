name: Fork build and release

on:
  push:
    branches: [custom]
    tags: ['sb-v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - font: all
            name: zashboard-singbox-full
          - font: none
            name: zashboard-singbox-no-fonts
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
      - name: Install and build
        env:
          FONT: ${{ matrix.font }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/sb-v') && github.ref_name || format('sb-v0.0.0-dev.{0}', github.sha) }}
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          test -f dist/index.html
          test "$(find dist -type f | wc -l)" -gt 1
          mkdir -p package
          cp -a dist package/dist
          (cd package && zip -qr "../${{ matrix.name }}.zip" dist)
      - name: Check package and checksum
        run: |
          unzip -l "${{ matrix.name }}.zip" | grep -E 'dist/index.html|dist/assets/'
          sha256sum "${{ matrix.name }}.zip" >> SHA256SUMS
          {
            printf 'release_tag=%s\n' "$GITHUB_REF_NAME"
            printf 'source_sha=%s\n' "$GITHUB_SHA"
            printf 'release_identity=%s\n' "$GITHUB_REF_NAME"
            printf 'artifact=%s\n' "${{ matrix.name }}.zip"
          } > MANIFEST
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}.zip
            MANIFEST
            SHA256SUMS
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/sb-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Enforce release provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin custom
          if [[ "$GITHUB_REF_NAME" =~ ^sb-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            test "$(git rev-parse origin/custom)" = "$GITHUB_SHA" || {
              echo 'stable releases must point exactly at custom' >&2
              exit 1
            }
          else
            git merge-base --is-ancestor origin/custom "$GITHUB_SHA" || {
              echo 'prereleases must be based on reviewed custom work' >&2
              exit 1
            }
            count=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '[.[] | select(.base.ref == "custom")] | length')
            test "$count" -gt 0 || {
              echo 'prerelease source must be associated with a PR targeting custom' >&2
              exit 1
            }
          fi
      - uses: actions/download-artifact@v8
        with:
          path: release
      - name: Assemble manifest and checksums
        run: |
          set -euo pipefail
          find release -name '*.zip' -exec cp {} . \;
          {
            printf 'release_tag=%s\n' "$GITHUB_REF_NAME"
            printf 'source_sha=%s\n' "$GITHUB_SHA"
            printf 'release_identity=%s\n' "$GITHUB_REF_NAME"
            find . -maxdepth 1 -name 'zashboard-*.zip' -printf 'artifact=%f\n' | sort
          } > MANIFEST
          find . -maxdepth 1 -name 'zashboard-*.zip' -exec sha256sum {} \; | sort > SHA256SUMS
          node scripts/verify-release-assets.mjs --dir .
      - uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-test') }}
          make_latest: ${{ !contains(github.ref_name, '-rc') && !contains(github.ref_name, '-test') }}
          generate_release_notes: true
          files: |
            zashboard-*.zip
            MANIFEST
            SHA256SUMS
      - name: Verify published assets and latest URLs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          for name in zashboard-singbox-full.zip zashboard-singbox-no-fonts.zip MANIFEST SHA256SUMS; do
            code=000
            for _ in $(seq 1 5); do
              code=$(curl -sSL -o "$RUNNER_TEMP/$name" -w '%{http_code}' "$base/$name" || true)
              [ "$code" = 200 ] && break
              sleep 5
            done
            test "$code" = 200 || { echo "asset $name is not downloadable" >&2; exit 1; }
          done
          (cd "$RUNNER_TEMP" && sha256sum -c "$GITHUB_WORKSPACE/SHA256SUMS")
          if [[ ! "$GITHUB_REF_NAME" =~ -rc|-test ]]; then
            for name in zashboard-singbox-full.zip zashboard-singbox-no-fonts.zip; do
              code=$(curl -sSL -o /dev/null -w '%{http_code}' \
                "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/$name")
              test "$code" = 200 || { echo "latest/download/$name did not resolve" >&2; exit 1; }
            done
          fi
      - name: Job summary
        if: always()
        run: |
          {
            printf '## Fork release\n\n'
            printf '| Item | Value |\n| --- | --- |\n'
            printf '| Tag | `%s` |\n' "$GITHUB_REF_NAME"
            printf '| Source SHA | `%s` |\n' "$GITHUB_SHA"
            for name in zashboard-singbox-full.zip zashboard-singbox-no-fonts.zip MANIFEST SHA256SUMS; do
              if [ -f "$name" ]; then
                printf '| %s | %s bytes | `%s` |\n' "$name" "$(stat -c%s "$name")" "$(sha256sum "$name" | cut -d' ' -f1)"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
