name: Auto release after reviewed sync merge

on:
  pull_request:
    branches: [custom]
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Already merged main -> custom synchronization PR number'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: auto-release
  cancel-in-progress: false

env:
  GH_REPO: ${{ github.repository }}

jobs:
  prepare:
    # Cheap trigger filter only; the authoritative gate is the eligibility
    # script after validation succeeds.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == 'custom' &&
       github.event.pull_request.head.ref == 'main' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.pr.outputs.number }}
      merge_sha: ${{ steps.pr.outputs.merge_sha }}
      url: ${{ steps.pr.outputs.url }}
      base: ${{ steps.pr.outputs.base }}
      head: ${{ steps.pr.outputs.head }}
      head_repo: ${{ steps.pr.outputs.head_repo }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: custom
          fetch-depth: 0
      - name: Resolve merged synchronization PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
        run: |
          set -euo pipefail
          test -n "$PR_NUMBER"
          gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json number,merged,baseRefName,headRefName,headRepository,mergeCommit,url \
            > "$RUNNER_TEMP/pr.json"
          pr="$RUNNER_TEMP/pr.json"
          merge_sha=$(jq -r '.mergeCommit.oid // empty' "$pr")
          test -n "$merge_sha" || { echo 'PR has no merge commit' >&2; exit 1; }
          {
            echo "number=$(jq -r .number "$pr")"
            echo "merged=$(jq -r .merged "$pr")"
            echo "base=$(jq -r .baseRefName "$pr")"
            echo "head=$(jq -r .headRefName "$pr")"
            echo "head_repo=$(jq -r '.headRepository.nameWithOwner // empty' "$pr")"
            echo "merge_sha=$merge_sha"
            echo "url=$(jq -r .url "$pr")"
          } >> "$GITHUB_OUTPUT"

  # Same reusable validation as the pre-merge sync PR, now on the exact
  # post-merge commit. A failure here stops the run before any tag is created.
  validate:
    needs: prepare
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/validate-sync.yml
    with:
      pr_number: ${{ needs.prepare.outputs.pr_number }}
      sha: ${{ needs.prepare.outputs.merge_sha }}

  decide:
    needs: [prepare, validate]
    outputs:
      decision: ${{ steps.state.outputs.decision }}
      tag: ${{ steps.state.outputs.tag }}
      reason: ${{ steps.state.outputs.reason }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: custom
          fetch-depth: 0
      - name: Enforce release gate and decide recovery state
        id: state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_MERGED: 'true'
          PR_BASE: ${{ needs.prepare.outputs.base }}
          PR_HEAD: ${{ needs.prepare.outputs.head }}
          PR_HEAD_REPO: ${{ needs.prepare.outputs.head_repo }}
          MERGE_SHA: ${{ needs.prepare.outputs.merge_sha }}
          VALIDATED: 'true'
          VALIDATION_SHA: ${{ needs.prepare.outputs.merge_sha }}
        run: |
          set -euo pipefail
          git fetch origin custom
          git fetch origin --tags --prune
          test "$(git rev-parse origin/custom)" = "$MERGE_SHA" || {
            echo 'merge commit is not the reviewed HEAD of custom' >&2; exit 1; }
          if ! CUSTOM_SHA="$MERGE_SHA" node scripts/release-eligibility.mjs; then
            echo 'PR does not qualify for an automatic release' >&2
            exit 1
          fi

          base_version=$(git show "$MERGE_SHA:package.json" | jq -r .version)
          tags=$(git for-each-ref --format='{"name":"%(refname:short)","sha":"%(objectname:peeled)"}' \
            refs/tags/sb-v* | jq -s '.')
          releases=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq 'map({tagName: .tag_name, assets: [.assets[].name]})')

          jq -n \
            --argjson tags "$tags" --argjson releases "$releases" \
            --arg mergeSha "$MERGE_SHA" --arg baseVersion "$base_version" \
            '{mergeSha:$mergeSha, baseVersion:$baseVersion, validated:true,
              validationSha:$mergeSha, tags:$tags, releases:$releases}' \
            > "$RUNNER_TEMP/release-state.json"
          state_output=$(node scripts/release-state.mjs --state "$RUNNER_TEMP/release-state.json")
          printf '%s\n' "$state_output" >> "$GITHUB_OUTPUT"
          printf 'Resolution: %s\n' "$(printf '%s\n' "$state_output" | sed -n 's/^reason=//p')" >> "$GITHUB_STEP_SUMMARY"

  tag:
    needs: [prepare, decide]
    if: needs.decide.outputs.decision == 'create-tag'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: custom
          fetch-depth: 0
      - name: Create one tag at the reviewed merge commit
        env:
          TAG: ${{ needs.decide.outputs.tag }}
          MERGE_SHA: ${{ needs.prepare.outputs.merge_sha }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag "$TAG" "$MERGE_SHA"
          test "$(git rev-parse "$TAG^{commit}")" = "$MERGE_SHA"
          git push origin "refs/tags/$TAG"

  publish:
    needs: [prepare, decide, tag]
    if: >-
      needs.decide.outputs.decision == 'create-tag' ||
      needs.decide.outputs.decision == 'publish'
    permissions:
      contents: write
    uses: ./.github/workflows/build-release.yml
    with:
      tag: ${{ needs.decide.outputs.tag }}
      source_sha: ${{ needs.prepare.outputs.merge_sha }}

  summary:
    needs: [prepare, decide, publish]
    if: always()
    steps:
      - name: Job summary
        env:
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
          PR_URL: ${{ needs.prepare.outputs.url }}
          MERGE_SHA: ${{ needs.prepare.outputs.merge_sha }}
          TAG: ${{ needs.decide.outputs.tag }}
          DECISION: ${{ needs.decide.outputs.decision }}
          REASON: ${{ needs.decide.outputs.reason }}
          RELEASE_URL: ${{ needs.publish.outputs.url }}
        run: |
          {
            printf '## Automatic fork release\n\n'
            printf '| Item | Value |\n| --- | --- |\n'
            printf '| Reviewed PR | #%s %s |\n' "${PR_NUMBER:-n/a}" "${PR_URL:-}"
            printf '| Source (merge) SHA | `%s` |\n' "${MERGE_SHA:-n/a}"
            printf '| Decision | `%s` |\n' "${DECISION:-n/a}"
            printf '| Tag | `%s` |\n' "${TAG:-n/a}"
            printf '| Release | %s |\n' "${RELEASE_URL:-n/a}"
            printf '\n%s\n' "${REASON:-}"
          } >> "$GITHUB_STEP_SUMMARY"
