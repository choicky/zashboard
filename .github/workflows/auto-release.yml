name: Auto release after reviewed sync merge

on:
  pull_request:
    branches: [custom]
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Already merged main -> custom synchronization PR number'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: read
  actions: write

concurrency:
  group: auto-release
  cancel-in-progress: false

env:
  GH_REPO: ${{ github.repository }}

jobs:
  release:
    # Only a merged PR is eligible. Closing without merging does nothing.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: custom
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve merged synchronization PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
        run: |
          set -euo pipefail
          test -n "$PR_NUMBER"
          pr_json="$RUNNER_TEMP/pr.json"
          gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json number,state,merged,baseRefName,headRefName,headRepository,mergeCommit,url \
            > "$pr_json"
          echo "number=$(jq -r .number "$pr_json")" >> "$GITHUB_OUTPUT"
          echo "merged=$(jq -r .merged "$pr_json")" >> "$GITHUB_OUTPUT"
          echo "base=$(jq -r .baseRefName "$pr_json")" >> "$GITHUB_OUTPUT"
          echo "head=$(jq -r .headRefName "$pr_json")" >> "$GITHUB_OUTPUT"
          echo "head_repo=$(jq -r '.headRepository.nameWithOwner // empty' "$pr_json")" >> "$GITHUB_OUTPUT"
          echo "merge_sha=$(jq -r '.mergeCommit.oid // empty' "$pr_json")" >> "$GITHUB_OUTPUT"
          echo "url=$(jq -r .url "$pr_json")" >> "$GITHUB_OUTPUT"

      - name: Enforce qualifying merge and source SHA
        id: source
        env:
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_MERGED: ${{ steps.pr.outputs.merged }}
          PR_BASE: ${{ steps.pr.outputs.base }}
          PR_HEAD: ${{ steps.pr.outputs.head }}
          PR_HEAD_REPO: ${{ steps.pr.outputs.head_repo }}
          MERGE_SHA: ${{ steps.pr.outputs.merge_sha }}
        run: |
          set -euo pipefail
          git fetch origin custom
          custom_sha=$(git rev-parse origin/custom)
          echo "custom_sha=$custom_sha" >> "$GITHUB_OUTPUT" 2>/dev/null || true
          if ! CUSTOM_SHA="$custom_sha" node scripts/release-eligibility.mjs; then
            echo 'Refusing to release: PR is not a reviewed main -> custom merge' >&2
            exit 1
          fi

      - name: Compute fork release version
        id: version
        env:
          MERGE_SHA: ${{ steps.pr.outputs.merge_sha }}
        run: |
          set -euo pipefail
          base_version=$(git show "$MERGE_SHA:package.json" | jq -r .version)
          existing="$RUNNER_TEMP/existing-tags.txt"
          git ls-remote --tags origin 'refs/tags/sb-v*' | awk -F/ '{print $NF}' \
            | grep -v '\^{}' > "$existing"
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName \
            | jq -r '.[].tagName' >> "$existing"
          sort -u -o "$existing" "$existing"
          node scripts/resolve-release-version.mjs \
            --base-version "$base_version" --existing-file "$existing" >> "$GITHUB_OUTPUT"

      - name: Refuse an existing tag or Release
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "tag $TAG already exists; refusing to overwrite" >&2
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists; refusing to overwrite" >&2
            exit 1
          fi

      - name: Create tag at the reviewed merge commit
        env:
          TAG: ${{ steps.version.outputs.tag }}
          MERGE_SHA: ${{ steps.pr.outputs.merge_sha }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag "$TAG" "$MERGE_SHA"
          test "$(git rev-parse "$TAG^{commit}")" = "$MERGE_SHA"
          git push origin "refs/tags/$TAG"

      - name: Dispatch build and release for the new tag
        id: dispatch
        # A tag pushed with GITHUB_TOKEN does not start the tag-triggered
        # build-release run. workflow_dispatch is exempt and is verified below.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          before=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build-release.yml \
            --event workflow_dispatch --limit 20 --json databaseId | jq -r '.[].databaseId' | sort)
          gh workflow run build-release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
          new_run=''
          for _ in $(seq 1 30); do
            after=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build-release.yml \
              --event workflow_dispatch --limit 20 --json databaseId | jq -r '.[].databaseId' | sort)
            new_run=$(comm -13 <(printf '%s\n' "$before") <(printf '%s\n' "$after") | head -n 1)
            [ -n "$new_run" ] && break
            sleep 2
          done
          if [ -z "$new_run" ]; then
            echo 'build-release workflow did not start after explicit dispatch' >&2
            exit 1
          fi
          echo "run_url=https://github.com/$GITHUB_REPOSITORY/actions/runs/$new_run" >> "$GITHUB_OUTPUT"

      - name: Job summary
        if: always()
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_URL: ${{ steps.pr.outputs.url }}
          MERGE_SHA: ${{ steps.pr.outputs.merge_sha }}
          TAG: ${{ steps.version.outputs.tag }}
          RUN_URL: ${{ steps.dispatch.outputs.run_url }}
        run: |
          {
            printf '## Automatic fork release\n\n'
            printf '| Item | Value |\n| --- | --- |\n'
            printf '| Reviewed PR | #%s %s |\n' "${PR_NUMBER:-n/a}" "${PR_URL:-}"
            printf '| Source (merge) SHA | `%s` |\n' "${MERGE_SHA:-n/a}"
            printf '| Release tag | `%s` |\n' "${TAG:-n/a}"
            printf '| Build/release run | %s |\n' "${RUN_URL:-n/a}"
          } >> "$GITHUB_STEP_SUMMARY"
