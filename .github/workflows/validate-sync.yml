name: Validate synchronization result

on:
  pull_request:
    branches: [custom]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Existing PR number targeting custom'
        required: true
        type: string
      sha:
        description: 'Exact commit to validate (post-merge); empty uses the PR merge ref'
        required: false
        type: string
      expected_head:
        description: 'Commit that must be contained in the validated result'
        required: false
        type: string
  # Before merge this runs as the PR's required checks (`validate`,
  # `native-browser`) for every PR into custom; PRs opened or updated by
  # GITHUB_TOKEN need "Approve workflows to run". After merge auto-release
  # calls it synchronously on the exact merge commit and fails if it fails,
  # so validation has one implementation only.
  workflow_call:
    inputs:
      pr_number:
        description: 'Existing PR number targeting custom'
        required: true
        type: string
      sha:
        description: 'Exact commit to validate (post-merge); empty uses the PR merge ref'
        required: false
        type: string
      expected_head:
        description: 'Commit that must be contained in the validated result'
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

# One run per validated commit/PR; an exact SHA never shares a group with a
# pre-merge merge ref.
concurrency:
  group: validate-sync-${{ inputs.sha || inputs.expected_head || inputs.pr_number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve intended merge result
        id: ref
        env:
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
          SHA: ${{ inputs.sha || '' }}
        run: |
          set -euo pipefail
          test -n "$PR_NUMBER"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          if [ -n "$SHA" ]; then
            echo "ref=$SHA" >> "$GITHUB_OUTPUT"
          else
            echo "ref=refs/pull/$PR_NUMBER/merge" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.ref.outputs.ref }}
          fetch-depth: 0
      - name: Verify validated result
        env:
          SHA: ${{ inputs.sha || '' }}
          EXPECTED_HEAD: ${{ inputs.expected_head || '' }}
        run: |
          set -euo pipefail
          if [ -n "$SHA" ]; then
            test "$(git rev-parse HEAD)" = "$SHA" || {
              echo 'validated commit does not match the requested SHA' >&2; exit 1; }
          elif [ -n "$EXPECTED_HEAD" ]; then
            git merge-base --is-ancestor "$EXPECTED_HEAD" HEAD || {
              echo 'proposed merge result does not contain the expected upstream head' >&2; exit 1; }
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
      - name: Validate proposed merge result
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm run type-check
          pnpm exec eslint . --quiet
          pnpm run build
          pnpm run test:compat
      - name: Browser acceptance
        run: pnpm test:verify
      - name: No-fonts release path
        run: |
          set -euo pipefail
          pnpm run build:no-fonts
          test -f dist/index.html
          test "$(find dist -type f | wc -l)" -gt 1
      - name: Job summary
        if: always()
        env:
          PR_NUMBER: ${{ steps.ref.outputs.pr_number }}
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          {
            printf '## Synchronization validation\n\n'
            printf 'Validated `%s` for PR #%s.\n\n' "$REF" "${PR_NUMBER:-unknown}"
            printf 'Checks: locked install, type-check, non-mutating lint, full build,\n'
            printf 'compatibility tests, browser acceptance, no-fonts build, real sing-box\n'
            printf 'native endpoint and native browser acceptance.\n'
          } >> "$GITHUB_STEP_SUMMARY"

  native-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve PR merge ref
        id: ref
        env:
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
          SHA: ${{ inputs.sha || '' }}
        run: |
          set -euo pipefail
          test -n "$PR_NUMBER"
          if [ -n "$SHA" ]; then
            echo "ref=$SHA" >> "$GITHUB_OUTPUT"
          else
            echo "ref=refs/pull/$PR_NUMBER/merge" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.ref.outputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
      - name: Build and run native sing-box acceptance
        # Pinned to the current stable release and the vendored proto source.
        # Rebuilds here because this job must test the browser against a build
        # on its own isolated runner; sharing an artifact would add a dependency
        # graph for a ~2s build.
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm run build
          mkdir -p "$RUNNER_TEMP/sing-box"
          curl -fsSL https://github.com/SagerNet/sing-box/releases/download/v1.14.4/sing-box-1.14.4-linux-amd64.tar.gz -o "$RUNNER_TEMP/sing-box/sing-box.tar.gz"
          tar -xzf "$RUNNER_TEMP/sing-box/sing-box.tar.gz" -C "$RUNNER_TEMP/sing-box"
          cat > "$RUNNER_TEMP/sing-box/config.json" <<'JSON'
          {"log":{"level":"info"},"inbounds":[],"outbounds":[{"type":"direct","tag":"direct"},{"type":"selector","tag":"auto","outbounds":["direct"]}],"experimental":{"clash_api":{"external_controller":"127.0.0.1:19093","secret":"ci-native-secret"}},"services":[{"type":"api","listen":"127.0.0.1","listen_port":19092,"secret":"ci-native-secret","access_control_allow_origin":["http://127.0.0.1:19080"],"dashboard":{"enabled":false}}]}
          JSON
          "$RUNNER_TEMP/sing-box/sing-box-1.14.4-linux-amd64/sing-box" run -c "$RUNNER_TEMP/sing-box/config.json" > "$RUNNER_TEMP/sing-box/core.log" 2>&1 &
          for i in $(seq 1 30); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:19092/ || true)
            if [ "$code" != 000 ]; then break; fi
            sleep 1
          done
          SINGBOX_SECRET=ci-native-secret SINGBOX_EXPECTED_VERSION=1.14.4 node test/singbox-native.mjs
          SINGBOX_SECRET=ci-native-secret SINGBOX_API_PORT=19092 SINGBOX_UI_PORT=19080 node test/native-browser.mjs
