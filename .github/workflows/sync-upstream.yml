name: Sync upstream

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fast-forward main from upstream
        run: |
          git remote add upstream https://github.com/Zephyruso/zashboard.git
          git fetch upstream main
          if ! git merge-base --is-ancestor HEAD upstream/main; then
            echo 'main has fork-only commits or has diverged; refusing overwrite' >&2
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse upstream/main)" ]; then
            git merge --ff-only upstream/main
            git push origin HEAD:main
          fi
      - name: Open one reusable custom synchronization PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/custom)" ]; then exit 0; fi
          gh pr list --base custom --head main --state open --json number --jq 'length' | grep -qx 0 || exit 0
          gh pr create --base custom --head main --title 'chore: sync upstream main' \
            --body 'Automated upstream synchronization. Resolve conflicts deliberately; compatibility changes stay on custom.'
