name: Sync upstream

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

# `gh` resolves the repository from local git remotes. The Fast-forward step
# adds an `upstream` remote pointing at Zephyruso/zashboard, so every `gh`
# command in this workflow must be pinned to the fork repository explicitly.
env:
  GH_REPO: ${{ github.repository }}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fast-forward main from upstream
        id: compare
        run: |
          set -euo pipefail
          old_main=$(git rev-parse HEAD)
          if ! git remote get-url upstream >/dev/null 2>&1; then
            git remote add upstream https://github.com/Zephyruso/zashboard.git
          fi
          git fetch origin custom
          git fetch upstream main
          upstream_sha=$(git rev-parse upstream/main)

          if ! git merge-base --is-ancestor HEAD upstream/main; then
            echo 'main has fork-only commits or has diverged; refusing overwrite' >&2
            echo 'failure_reason=main has fork-only commits or has diverged from upstream' >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # Fast-forward the mirror whenever possible. If custom already
          # contains upstream/main, this is a successful no-op for custom and
          # must not create a duplicate synchronization PR.
          if [ "$old_main" != "$upstream_sha" ]; then
            git merge --ff-only upstream/main
            git push origin HEAD:main
            main_changed=true
          else
            main_changed=false
          fi
          new_main=$(git rev-parse HEAD)

          if git merge-base --is-ancestor upstream/main origin/custom; then
            needs_sync=false
          else
            needs_sync=true
          fi

          {
            echo "old_main=$old_main"
            echo "new_main=$new_main"
            echo "upstream_sha=$upstream_sha"
            echo "main_changed=$main_changed"
            echo "needs_sync=$needs_sync"
          } >> "$GITHUB_OUTPUT"

      - name: Open or reuse one synchronization PR
        id: pr
        if: steps.compare.outputs.needs_sync == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_SHA: ${{ steps.compare.outputs.upstream_sha }}
        run: |
          set -euo pipefail

          # The relevant range is what custom does not contain yet. main may
          # already be fast-forwarded when this workflow runs, so an
          # old-main..new-main range would be empty and misleading.
          range="origin/custom..$UPSTREAM_SHA"
          changed=$(git diff --name-only "$range" || true)
          sensitive=$(printf '%s\n' "$changed" | grep -Ei 'sing.?box|src/gen/|vendor/|backend|api|assembly|proto' || true)
          {
            printf '## Upstream synchronization\n\n'
            printf 'Upstream range: `%s`\n\n' "$range"
            printf '### Upstream commits\n\n```\n'
            git log --oneline --no-merges "$range" || true
            printf '\n```\n\n'
            printf '### Changed files\n\n```\n%s\n```\n\n' "$changed"
            printf '### sing-box-sensitive files\n\n```\n%s\n```\n\n' "${sensitive:-none detected}"
            printf '### Validation status\n\n'
            printf 'Automated validation runs for the exact PR merge result in\n'
            printf '`Validate synchronization result`. Review its result before merging.\n\n'
            printf '### Unresolved risks\n\n'
            printf 'Upstream changes may overlap restored sing-box compatibility code. Check the\n'
            printf 'Clash API and native gRPC-Web results; Git reporting no conflicts is not approval.\n\n'
            printf '> A successful build or clean merge does **not** authorize merging this PR.\n'
            printf '> Review the diff, validation results and sing-box compatibility before merging.\n'
          } > "$RUNNER_TEMP/pr-body.md"

          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/custom)" ]; then
            echo 'main is already incorporated into custom; no PR needed' >> "$GITHUB_STEP_SUMMARY"
            echo 'action=none' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --base custom --head main \
            --state open --json number,url)
          count=$(printf '%s' "$existing" | jq 'length')
          if [ "$count" -gt 1 ]; then
            echo 'more than one open main -> custom PR exists; refusing to create another' >&2
            echo 'failure_reason=multiple open synchronization PRs' >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ "$count" -eq 1 ]; then
            number=$(printf '%s' "$existing" | jq -r '.[0].number')
            url=$(printf '%s' "$existing" | jq -r '.[0].url')
            if ! gh pr edit "$number" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/pr-body.md"; then
              echo 'GitHub could not refresh the existing synchronization PR' >&2
              echo 'failure_reason=GitHub could not refresh the synchronization PR' >> "$GITHUB_OUTPUT"
              exit 1
            fi
            echo "number=$number" >> "$GITHUB_OUTPUT"
            echo "url=$url" >> "$GITHUB_OUTPUT"
            echo 'action=reused' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! url=$(gh pr create --repo "$GITHUB_REPOSITORY" --base custom --head main \
            --title 'chore: sync upstream main' --body-file "$RUNNER_TEMP/pr-body.md"); then
            echo 'GitHub could not create the main -> custom PR' >&2
            echo 'failure_reason=GitHub could not create the synchronization PR' >> "$GITHUB_OUTPUT"
            exit 1
          fi
          number=$(gh pr view "$url" --repo "$GITHUB_REPOSITORY" --json number --jq .number)
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo 'action=created' >> "$GITHUB_OUTPUT"

      - name: Dispatch validation for the exact PR
        id: dispatch
        # A PR created with GITHUB_TOKEN may produce a pull_request run, but in
        # this repository that run stops at `action_required` with zero jobs.
        # workflow_dispatch is exempt from GITHUB_TOKEN event suppression and
        # was observed to execute both validation jobs, so dispatch explicitly
        # and verify the new run actually appears.
        if: steps.pr.outputs.number != '' && steps.pr.outputs.failure_reason == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          before=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow validate-sync.yml \
            --event workflow_dispatch --limit 20 --json databaseId | jq -r '.[].databaseId' | sort)
          gh workflow run validate-sync.yml --repo "$GITHUB_REPOSITORY" --ref custom \
            --field pr_number="$PR_NUMBER"
          new_run=''
          for _ in $(seq 1 30); do
            after=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow validate-sync.yml \
              --event workflow_dispatch --limit 20 --json databaseId | jq -r '.[].databaseId' | sort)
            new_run=$(comm -13 <(printf '%s\n' "$before") <(printf '%s\n' "$after") | head -n 1)
            [ -n "$new_run" ] && break
            sleep 2
          done
          if [ -z "$new_run" ]; then
            echo 'validation workflow did not start after explicit dispatch' >&2
            echo 'failure_reason=validation workflow did not start' >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "validation_run_url=https://github.com/$GITHUB_REPOSITORY/actions/runs/$new_run" >> "$GITHUB_OUTPUT"

      - name: Job summary
        if: always()
        env:
          OLD_MAIN: ${{ steps.compare.outputs.old_main }}
          NEW_MAIN: ${{ steps.compare.outputs.new_main }}
          UPSTREAM_SHA: ${{ steps.compare.outputs.upstream_sha }}
          MAIN_CHANGED: ${{ steps.compare.outputs.main_changed }}
          NEEDS_SYNC: ${{ steps.compare.outputs.needs_sync }}
          FAIL_COMPARE: ${{ steps.compare.outputs.failure_reason }}
          PR_ACTION: ${{ steps.pr.outputs.action }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_URL: ${{ steps.pr.outputs.url }}
          FAIL_PR: ${{ steps.pr.outputs.failure_reason }}
          VALIDATION_URL: ${{ steps.dispatch.outputs.validation_run_url }}
        run: |
          {
            printf '## Upstream synchronization\n\n'
            printf '| Item | Value |\n| --- | --- |\n'
            printf '| Old main SHA | `%s` |\n' "${OLD_MAIN:-n/a}"
            printf '| New main SHA | `%s` |\n' "${NEW_MAIN:-n/a}"
            printf '| Upstream SHA | `%s` |\n' "${UPSTREAM_SHA:-n/a}"
            printf '| Main changed | `%s` |\n' "${MAIN_CHANGED:-n/a}"
            printf '| Custom needs sync | `%s` |\n' "${NEEDS_SYNC:-n/a}"
            printf '| PR action | `%s` |\n' "${PR_ACTION:-n/a}"
            printf '| PR number | `%s` |\n' "${PR_NUMBER:-n/a}"
            printf '| PR URL | %s |\n' "${PR_URL:-n/a}"
            printf '| Validation run | %s |\n' "${VALIDATION_URL:-n/a}"
            printf '\n'
            reason="${FAIL_COMPARE:-$FAIL_PR}"
            if [ -n "$reason" ]; then
              printf '**Failure reason:** %s\n' "$reason"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
